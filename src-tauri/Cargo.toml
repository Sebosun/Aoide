[package]
name = "aoide"
version = "0.1.0"
description = "Local EPUB audiobook player"
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "aoide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["whisper"]
# Speech recognition for syncing recordings (builds whisper.cpp: CMake, a C++ compiler, libclang).
whisper = ["aoide-transcribe/whisper"]
# Recognition on an NVIDIA GPU (needs the CUDA toolkit with cuBLAS) or any Vulkan GPU.
whisper-cuda = ["whisper", "aoide-transcribe/whisper-cuda"]
whisper-vulkan = ["whisper", "aoide-transcribe/whisper-vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util", "signal"] }
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aoide-epub = { path = "../crates/epub-parser" }
aoide-article = { path = "../crates/article" }
aoide-document = { path = "../crates/document" }
aoide-fetch = { path = "../crates/fetch" }
aoide-browser = { path = "../crates/browser" }
aoide-feeds = { path = "../crates/feeds" }
url = "2"
aoide-text = { path = "../crates/segmenter" }
aoide-tts = { path = "../crates/tts" }
aoide-chatterbox = { path = "../crates/chatterbox-client" }
aoide-openai-speech = { path = "../crates/openai-speech" }
aoide-generation = { path = "../crates/generation" }
aoide-audio = { path = "../crates/audio" }
aoide-library = { path = "../crates/library" }
aoide-metadata = { path = "../crates/metadata" }
aoide-aligner = { path = "../crates/aligner" }
aoide-discovery = { path = "../crates/discovery" }
aoide-config = { path = "../crates/config" }
aoide-recording = { path = "../crates/recording" }
aoide-classifier = { path = "../crates/classifier" }
aoide-pdf = { path = "../crates/pdf" }
aoide-sync = { path = "../crates/sync" }
aoide-transcribe = { path = "../crates/transcribe" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
toml = "1"
rayon = "1"
reflink-copy = "0.1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt", "ansi", "env-filter", "tracing-log", "std", "smallvec"] }
tracing-log = "0.2"

[dev-dependencies]
aoide-tts = { path = "../crates/tts", features = ["testing", "ts"] }
aoide-pdf = { path = "../crates/pdf", features = ["testing"] }
aoide-library = { path = "../crates/library", features = ["ts"] }
aoide-epub = { path = "../crates/epub-parser", features = ["ts"] }
aoide-config = { path = "../crates/config", features = ["ts"] }
aoide-metadata = { path = "../crates/metadata", features = ["ts"] }
roxmltree = "0.21"
# Read the Tauri commands for the generated contract.
quote = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

# Signals to the speech server's process group, and its parent-death signal.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

# Media keys: MPRIS served directly on Linux, souvlaki elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
souvlaki = "0.8.3"
