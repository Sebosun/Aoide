# The Chrome for Testing build "Download Chrome" fetches, one per platform.
#
# Source: https://googlechromelabs.github.io/chrome-for-testing/ (the JSON endpoints list the
# download addresses; they publish no checksums). Each SHA-256 below was computed from the
# downloaded zip and cross-checked against the MD5 the storage host states in `x-goog-hash`.
# Aoide does not redistribute the browser: each user's app downloads it from Google, and its
# use is under Google's Chrome terms (https://www.google.com/chrome/terms/).
#
# To move to a newer build: take the Stable version from
# last-known-good-versions-with-downloads.json, then for each platform:
#   curl -sS "$url" | tee >(md5sum) | sha256sum     and   curl -sSI "$url"  (size, x-goog-hash)

version = "157.0.8103.78"
base = "https://storage.googleapis.com/chrome-for-testing-public"

[platforms.linux64]
bytes = 203266906
sha256 = "9223832977a13db3646201b1341c1f9cf08afa3ceae92540116d7b0c062364fb"
program = "chrome-linux64/chrome"

