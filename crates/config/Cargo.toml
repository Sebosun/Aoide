[package]
name = "aoide-config"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Aoide user settings and themes stored as TOML under $XDG_CONFIG_HOME/aoide"

[features]
# TypeScript declarations for the UI contract (src/api/contract.ts).
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12.0.1", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"
