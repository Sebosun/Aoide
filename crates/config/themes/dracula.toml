# Dracula, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Dracula"

[light]
ground = "#efeddc"
cover-tint = "#e6e2c9"
page = "#fffbeb"
ink = "#1f1f1f"
reading = "#2b2b2b"
dim = "#5c5690"
faint = "#9a96bf"
line = "#dedccf"
glass = "rgba(255, 251, 235, 0.72)"
hero = "#cfcfde"
wash = "#efeddc"
accent = "#644ac9"
on-accent = "#fffbeb"
ok = "#14710a"
warn = "#846e15"
shadow = "rgba(31, 31, 31, 0.25)"

[dark]
ground = "#191a21"
cover-tint = "#21222c"
page = "#282a36"
ink = "#f8f8f2"
reading = "#e9e9e2"
dim = "#c0c4dc"
faint = "#6272a4"
line = "#44475a"
glass = "rgba(40, 42, 54, 0.78)"
hero = "#44475a"
wash = "#343746"
accent = "#bd93f9"
on-accent = "#191a21"
ok = "#50fa7b"
warn = "#ffb86c"
shadow = "rgba(0, 0, 0, 0.6)"
