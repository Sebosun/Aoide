# Gruvbox, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Gruvbox"

[light]
ground = "#f2e5bc"
cover-tint = "#ebdbb2"
page = "#fbf1c7"
ink = "#282828"
reading = "#3c3836"
dim = "#665c54"
faint = "#a89984"
line = "#d5c4a1"
glass = "rgba(251, 241, 199, 0.72)"
hero = "#d5c4a1"
wash = "#ebdbb2"
accent = "#af3a03"
on-accent = "#fbf1c7"
ok = "#79740e"
warn = "#b57614"
shadow = "rgba(40, 40, 40, 0.3)"
mark = "rgba(215, 153, 33, 0.32)"

