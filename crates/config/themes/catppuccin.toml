cover-tint = "#181825"
page = "#1e1e2e"
ink = "#cdd6f4"
reading = "#bac2de"
dim = "#a6adc8"
faint = "#6c7086"
line = "#313244"
glass = "rgba(30, 30, 46, 0.78)"
hero = "#45475a"
wash = "#313244"
