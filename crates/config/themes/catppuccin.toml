# Catppuccin, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Catppuccin"

[light]
ground = "#dce0e8"
cover-tint = "#ccd0da"
page = "#eff1f5"
ink = "#3d4058"
reading = "#4c4f69"
dim = "#5c5f77"
faint = "#8c8fa1"
line = "#ccd0da"
glass = "rgba(239, 241, 245, 0.72)"
hero = "#bcc0cc"
wash = "#e6e9ef"
accent = "#8839ef"
on-accent = "#eff1f5"
ok = "#2e7d1f"
warn = "#a8650f"
shadow = "rgba(76, 79, 105, 0.3)"
mark = "rgba(223, 142, 29, 0.28)"

[dark]
