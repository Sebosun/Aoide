# Tokyo Night, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Tokyo Night"

[light]
ground = "#d0d5e3"
cover-tint = "#c4c8da"
page = "#e1e2e7"
ink = "#28356b"
reading = "#2f3f7c"
dim = "#4b5a96"
faint = "#848cb5"
line = "#c4c8da"
glass = "rgba(225, 226, 231, 0.72)"
hero = "#c4c8da"
wash = "#d6d8e2"
accent = "#2e5fc0"
on-accent = "#ffffff"
ok = "#486129"
warn = "#8c5a00"
shadow = "rgba(55, 96, 191, 0.25)"

[dark]
ground = "#16161e"
cover-tint = "#1f2335"
page = "#1a1b26"
ink = "#c0caf5"
reading = "#c0caf5"
dim = "#a9b1d6"
faint = "#565f89"
line = "#292e42"
glass = "rgba(26, 27, 38, 0.78)"
hero = "#292e42"
wash = "#1f2335"
accent = "#7aa2f7"
on-accent = "#16161e"
ok = "#9ece6a"
warn = "#e0af68"
shadow = "rgba(0, 0, 0, 0.6)"
