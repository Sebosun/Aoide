# Rosé Pine, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Rosé Pine"

[light]
ground = "#f2e9e1"
cover-tint = "#f4ede8"
page = "#fffaf3"
ink = "#46415f"
reading = "#575279"
dim = "#635e7f"
faint = "#9893a5"
line = "#dfdad9"
glass = "rgba(255, 250, 243, 0.72)"
hero = "#dfdad9"
wash = "#f4ede8"
accent = "#286983"
on-accent = "#fffaf3"
ok = "#286983"
warn = "#b26b0e"
shadow = "rgba(87, 82, 121, 0.25)"
mark = "rgba(234, 157, 52, 0.26)"

[dark]
