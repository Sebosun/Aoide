# Everforest, matched to Aoide's colour tokens (About › Theme lists them); a file of the
# same name in the themes folder replaces it.
title = "Everforest"

[light]
ground = "#efebd4"
cover-tint = "#e6e2cc"
page = "#fdf6e3"
ink = "#38444b"
reading = "#43525a"
dim = "#5c6a72"
faint = "#939f91"
line = "#e0dcc7"
glass = "rgba(253, 246, 227, 0.72)"
hero = "#e0dcc7"
wash = "#f4f0d9"
accent = "#56700a"
on-accent = "#fdf6e3"
ok = "#4f7a0a"
warn = "#9a6c00"
shadow = "rgba(92, 106, 114, 0.25)"

[dark]
