cover-tint = "#343f44"
page = "#2d353b"
ink = "#e2d7bd"
reading = "#d3c6aa"
dim = "#9da9a0"
faint = "#7a8478"
line = "#3d484d"
glass = "rgba(45, 53, 59, 0.78)"
hero = "#475258"
wash = "#343f44"
accent = "#a7c080"
