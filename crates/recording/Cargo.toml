[package]
name = "aoide-recording"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Audiobook files for Aoide: inspection, DRM checks, and decoding a multi-file timeline"

[dependencies]
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3"] }
