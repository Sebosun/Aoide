[package]
name = "aoide-browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Renders a web page in Chrome or Chromium and keeps it as a snapshot; off unless asked for"
publish = false

[dependencies]
aoide-fetch = { path = "../fetch" }
# DevTools protocol client; wrapped here so the rest of the app sees only this crate's API.
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
