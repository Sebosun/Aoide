[package]
name = "aoide-audio"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Opus segment codec and gapless, pitch-preserving segment player for Aoide"

[dependencies]
opus = "0.3"
# Build libopus from bundled source and link statically (no opus-devel needed).
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"
signalsmith-stretch = "0.1"
thiserror = "2"
