[package]
name = "aoide-chatterbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Chatterbox TTS Server HTTP client"
publish = false

[dependencies]
aoide-tts = { path = "../tts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
aoide-tts = { path = "../tts", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
