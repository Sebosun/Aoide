[package]
name = "aoide-classifier"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Tags for library items from a local language model (OpenAI-compatible chat API)"

[dependencies]
aoide-tts = { path = "../tts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
