[package]
name = "aoide-openai-speech"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Aoide TTS adapter for local OpenAI-compatible /v1/audio/speech servers"

[dependencies]
aoide-tts = { path = "../tts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aoide-tts = { path = "../tts", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
