[package]
name = "aoide-transcribe"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Speech recognition with word times for Aoide (whisper.cpp built in)"

[features]
# Builds whisper.cpp (needs CMake, a C++ compiler and libclang). Off for `npm test`.
whisper = ["dep:whisper-rs"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
aoide-tts = { path = "../tts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
aoide-epub = { path = "../epub-parser" }
aoide-recording = { path = "../recording" }
aoide-sync = { path = "../sync" }
aoide-text = { path = "../segmenter" }

[[example]]
name = "sync_book"
required-features = ["whisper"]
