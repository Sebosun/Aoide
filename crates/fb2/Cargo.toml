[package]
name = "aoide-fb2"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "FictionBook (FB2) files, as Aoide's parsed-book model"

[dependencies]
aoide-document = { path = "../document" }
base64 = "0.22"
roxmltree = "0.21"
thiserror = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
