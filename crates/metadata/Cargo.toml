[package]
name = "aoide-metadata"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Open Library book metadata lookup for Aoide"

[features]
# TypeScript declarations for the UI contract (src/api/contract.ts).
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12.0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
