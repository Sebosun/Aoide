<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" width="1040" height="290" role="img" aria-labelledby="title desc">
  <title id="title">How Aoide turns a book into speech</title>
  <desc id="desc">Your EPUB is read into chapters and sentences once. Then, just ahead of where you are listening, each sentence goes to a speech server on your computer, the audio is cached, and the player plays it while highlighting each word.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f3f4fb; }
    .card { fill: #ffffff; stroke: #d6daef; stroke-width: 1.5; }
    .card-hot { fill: #ffffff; stroke: #e0502f; stroke-width: 2; }
    .title { fill: #141a3d; font-size: 17px; font-weight: 700; }
    .sub { fill: #5a6188; font-size: 13px; }
    .badge { fill: #141a3d; }
    .badge-hot { fill: #e0502f; }
    .badge-text { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #9aa0c3; stroke-width: 2; fill: none; }
    .head { fill: #9aa0c3; }
    .brace { stroke: #b8bdd9; stroke-width: 1.5; fill: none; }
    .note { fill: #5a6188; font-size: 13.5px; }
    .note-hot { fill: #c2401f; font-size: 13.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151a33; }
      .card, .card-hot { fill: #1f2547; }
      .card { stroke: #353c68; }
      .card-hot { stroke: #ff7a52; }
      .title { fill: #eef0fb; }
      .sub, .note { fill: #a9afd3; }
      .badge { fill: #4a5288; }
      .badge-hot { fill: #ff6a3d; }
      .arrow { stroke: #6c739e; }
      .head { fill: #6c739e; }
      .brace { stroke: #4a5288; }
      .note-hot { fill: #ff8a63; }
    }
  </style>
  <rect class="bg" width="1040" height="290" rx="18"/>

  <!-- Six steps, 146 wide, 26 apart, starting at x=24 -->
  <g>
    <rect class="card" x="24" y="40" width="146" height="128" rx="14"/>
    <circle class="badge" cx="50" cy="66" r="13"/><text class="badge-text" x="50" y="70.5" text-anchor="middle">1</text>
    <text class="title" x="40" y="108">Your EPUB</text>
    <text class="sub" x="40" y="130">read, never</text>
    <text class="sub" x="40" y="148">changed</text>
  </g>
  <g>
    <rect class="card" x="196" y="40" width="146" height="128" rx="14"/>
    <circle class="badge" cx="222" cy="66" r="13"/><text class="badge-text" x="222" y="70.5" text-anchor="middle">2</text>
    <text class="title" x="212" y="108">Chapters</text>
    <text class="sub" x="212" y="130">text by chapter,</text>
    <text class="sub" x="212" y="148">footnotes kept apart</text>
  </g>
  <g>
    <rect class="card" x="368" y="40" width="146" height="128" rx="14"/>
    <circle class="badge" cx="394" cy="66" r="13"/><text class="badge-text" x="394" y="70.5" text-anchor="middle">3</text>
    <text class="title" x="384" y="108">Sentences</text>
    <text class="sub" x="384" y="130">short ones</text>
    <text class="sub" x="384" y="148">grouped together</text>
  </g>
  <g>
    <rect class="card-hot" x="540" y="40" width="146" height="128" rx="14"/>
    <circle class="badge-hot" cx="566" cy="66" r="13"/><text class="badge-text" x="566" y="70.5" text-anchor="middle">4</text>
    <text class="title" x="556" y="108">Speech server</text>
    <text class="sub" x="556" y="130">on your computer,</text>
    <text class="sub" x="556" y="148">one sentence a time</text>
  </g>
  <g>
    <rect class="card-hot" x="712" y="40" width="146" height="128" rx="14"/>
    <circle class="badge-hot" cx="738" cy="66" r="13"/><text class="badge-text" x="738" y="70.5" text-anchor="middle">5</text>
    <text class="title" x="728" y="108">Audio cache</text>
    <text class="sub" x="728" y="130">kept, so nothing is</text>
    <text class="sub" x="728" y="148">made twice</text>
  </g>
  <g>
    <rect class="card-hot" x="884" y="40" width="132" height="128" rx="14"/>
    <circle class="badge-hot" cx="910" cy="66" r="13"/><text class="badge-text" x="910" y="70.5" text-anchor="middle">6</text>
    <text class="title" x="900" y="108">Player</text>
    <text class="sub" x="900" y="130">highlights each</text>
    <text class="sub" x="900" y="148">word as it's read</text>
  </g>

  <!-- Arrows -->
  <g>
    <path class="arrow" d="M172 104 H190"/><path class="head" d="M194 104 l-8 -5 v10 z"/>
    <path class="arrow" d="M344 104 H362"/><path class="head" d="M366 104 l-8 -5 v10 z"/>
    <path class="arrow" d="M516 104 H534"/><path class="head" d="M538 104 l-8 -5 v10 z"/>
    <path class="arrow" d="M688 104 H706"/><path class="head" d="M710 104 l-8 -5 v10 z"/>
    <path class="arrow" d="M860 104 H878"/><path class="head" d="M882 104 l-8 -5 v10 z"/>
  </g>

  <!-- Braces under the two phases -->
  <path class="brace" d="M24 192 v10 H514 v-10 M269 202 v12"/>
  <text class="note" x="269" y="236" text-anchor="middle">When you open a book</text>
  <text class="note" x="269" y="256" text-anchor="middle">(a moment, no network needed)</text>

  <path class="brace" d="M540 192 v10 H1016 v-10 M778 202 v12"/>
  <text class="note-hot" x="778" y="236" text-anchor="middle">Just ahead of where you are listening</text>
  <text class="note" x="778" y="256" text-anchor="middle">(or the whole book in advance, if you ask)</text>
</svg>
